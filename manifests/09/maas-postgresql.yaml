apiVersion: v1
kind: Secret
metadata:
  name: maas-postgresql-credentials
  namespace: redhat-ods-applications
type: Opaque
stringData:
  POSTGRESQL_DATABASE: maasdb
  POSTGRESQL_USER: maas
  POSTGRESQL_PASSWORD: maasdb123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maas-postgresql-pvc
  namespace: redhat-ods-applications
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-postgresql
  namespace: redhat-ods-applications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-postgresql
  template:
    metadata:
      labels:
        app: maas-postgresql
    spec:
      containers:
      - name: postgresql
        image: registry.redhat.io/rhel9/postgresql-15:latest
        envFrom:
        - secretRef:
            name: maas-postgresql-credentials
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/pgsql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: maas-postgresql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: maas-postgresql
  namespace: redhat-ods-applications
spec:
  selector:
    app: maas-postgresql
  ports:
  - port: 5432
    targetPort: 5432
